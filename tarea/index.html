<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de notas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
        }

        section {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
        }

        input, button {
            padding: 6px;
            margin: 4px;
        }

        .error {
            color: red;
        }

        .estudiante {
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <h1 id="titulo">Registro de notas</h1>

    <section>
        <h2>Registrar estudiante</h2>

        <form id="formEstudiante">
            <input id="nombre" type="text" placeholder="Nombre del estudiante">
            <input id="nota" type="number" placeholder="Nota de 0 a 20">
            <button type="submit">Agregar</button>
        </form>

        <p id="mensaje"></p>
    </section>

    <section>
        <h2>Buscar estudiante</h2>
        <input id="buscar" type="text" placeholder="Escribe un nombre">
        <p id="textoBusqueda">Buscando: ...</p>
    </section>

    <section>
        <h2>Estudiantes registrados</h2>
        <ul id="listaEstudiantes"></ul>
    </section>

    <script src="app.js"></script>

</body>
</html>
